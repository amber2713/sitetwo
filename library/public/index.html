<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Library Explorer · Echoes of Memory</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* enhances immersion, click remains functional */
        }

        body {
            font-family: 'Cambria', Georgia, 'Times New Roman', serif;
            background-color: #0a0c15;
            color: #f0f0f0;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: color 0.4s ease;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('./images/tushuguan.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            z-index: -2;
            /* 初始状态（Guomo出来前）：较暗的光亮度 */
            filter: brightness(0.4); 
            transition: filter 1.2s cubic-bezier(0.2, 0.9, 0.4, 1);
        }

        /* LIGHT MODE (Guomo 出现后的第二阶段) – 背景亮度大幅提升 */
        body.light-mode {
            color: #1e2a2e;
        }
        
        /* 当触发亮色模式时，背景图的光亮度提高 */
        body.light-mode::before {
            filter: brightness(0.95); /* 几乎完全明亮，同时保留一点细节舒适感 */
        }

        body.light-mode .quote-box {
            background: rgba(250, 248, 235, 0.85);
            border: 1px solid rgba(180, 130, 70, 0.5);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        body.light-mode .quote {
            color: #3e2c1a;
            text-shadow: none;
        }
        body.light-mode .title {
            background: linear-gradient(135deg, #8b5a2b, #c68b3c);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        body.light-mode .navbar {
            background: rgba(245, 240, 225, 0.6);
            border-bottom: 1px solid rgba(150, 110, 60, 0.3);
            backdrop-filter: blur(12px);
        }
        body.light-mode .footer {
            color: #4a3b28;
            background: rgba(245, 240, 225, 0.5);
        }
        body.light-mode .explore-icon {
            background: rgba(160, 110, 50, 0.9);
            border: 2px solid #ffdd99;
            box-shadow: 0 0 18px rgba(200, 140, 40, 0.7);
        }
        body.light-mode .explore-icon i {
            color: #fff3e0;
        }
        body.light-mode .explore-text {
            color: #5a3a1a;
            font-weight: bold;
        }

        /* floating particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 235, 190, 0.7);
            animation: float 18s infinite linear;
        }
        @keyframes float {
            0% { transform: translateY(0) translateX(0); opacity: 0.7; }
            100% { transform: translateY(-100vh) translateX(80px); opacity: 0; }
        }

        /* navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(10, 15, 30, 0.45);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            z-index: 15;
        }
        .title {
            font-size: 2.7rem;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #ecdca8, #cbad7a);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 600;
            text-shadow: 0 0 5px rgba(0,0,0,0.2);
        }

        /* main container */
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 24px 60px;
            text-align: center;
            max-width: 950px;
            margin: 0 auto;
            width: 100%;
            position: relative;
        }

        /* quote box */
        .quote-box {
            background: rgba(20, 25, 45, 0.7);
            border-radius: 28px;
            padding: 38px 32px;
            margin: 20px 0 30px;
            border: 1px solid rgba(200, 170, 110, 0.6);
            width: 100%;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(3px);
            transition: all 0.4s;
        }
        .quote {
            font-size: 1.55rem;
            line-height: 1.65;
            color: #f3e7ce;
            font-style: italic;
            white-space: pre-wrap;
            font-weight: 500;
            transition: color 0.2s;
        }

        /* blinking cursor for typing */
        .cursor::after {
            content: '|';
            animation: blink 1s infinite;
            color: #dbb879;
            margin-left: 4px;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* book container – phase one */
        .book-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0 30px;
            cursor: pointer;
            transition: transform 0.25s ease, filter 0.2s;
        }
        .book-wrapper:hover {
            transform: scale(1.02);
            filter: drop-shadow(0 0 12px rgba(230, 200, 120, 0.5));
        }
        .book-img {
            max-width: 240px;
            width: 70%;
            height: auto;
            border-radius: 16px;
            transition: all 0.2s;
            filter: drop-shadow(4px 8px 16px rgba(0,0,0,0.5));
            object-fit: contain;
        }

        /* 【新增】翻开的书本及过渡文字大遮罩层 */
        .open-book-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease, visibility 0.8s ease;
            background: rgba(10, 10, 10, 0.45);
            backdrop-filter: blur(4px);
        }
        .open-book-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .book-container {
            position: relative;
            z-index: 10;
            width: 60vw; /* 占据页面接近一半的比例 */
            max-width: 800px;
            height: 50vh;
            background: #f4edd8;
            border-radius: 4px;
            box-shadow:
                0 15px 35px rgba(0,0,0,0.5),
                inset 0 0 40px rgba(93, 64, 55, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.4rem 2rem;
            opacity: 0;
            transform: scale(0.95);
            animation: fadeInBook 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards 0.5s;
            transition: all 0.8s ease;
        }
        .open-book-overlay.active .book-container {
            opacity: 1;
            transform: scale(1);
        }
        .book-container::before,
        .book-container::after {
            content: '';
            position: absolute;
            top: 12px;
            bottom: 12px;
            width: calc(50% - 22px);
            background: linear-gradient(180deg, #fbf4e0 0%, #e9dcc0 100%);
            border-radius: 0 18px 18px 0;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.05);
        }
        .book-container::before {
            left: 16px;
            border-radius: 18px 0 0 18px;
        }
        .book-container::after {
            right: 16px;
            border-radius: 0 18px 18px 0;
        }
        .open-book-text {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 100%;
            font-family: 'Noto Serif SC', 'Cambria', serif;
            font-size: 1.45rem;
            line-height: 1.85;
            color: #2c1a0c; /* 书页暗色文字 */
            text-align: justify;
            white-space: pre-wrap;
            word-break: break-word;
            opacity: 0;
            transition: opacity 1s ease;
            text-shadow: none;
            font-weight: 600;
        }
        .open-book-text.fade-in {
            opacity: 1;
        }
        @keyframes fadeInBook {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* explore entrance (phase two) */
        .explore-icon {
            display: none; 
            align-items: center;
            justify-content: center;
            width: 110px;
            height: 110px;
            background: rgba(190, 150, 85, 0.85);
            border-radius: 60px;
            border: 2px solid #e7c389;
            cursor: pointer;
            text-decoration: none;
            margin-top: 20px;
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            backdrop-filter: blur(2px);
        }
        .explore-icon i {
            font-size: 48px;
            color: #2b1e0c;
        }
        .explore-icon:hover {
            transform: scale(1.08);
            background: #c99f5e;
            box-shadow: 0 0 20px rgba(230, 190, 100, 0.8);
        }
        .explore-text {
            display: none;
            margin-top: 14px;
            font-size: 1.25rem;
            letter-spacing: 1px;
            color: #ecdca8;
            font-weight: 600;
            background: rgba(0,0,0,0.3);
            padding: 4px 14px;
            border-radius: 30px;
            backdrop-filter: blur(2px);
        }

        .footer {
            text-align: center;
            padding: 18px;
            font-size: 0.85rem;
            color: #b9aa86;
            background: rgba(10, 15, 30, 0.5);
            transition: all 0.3s;
            margin-top: auto; /* Push footer to bottom safely */
        }

        .hidden {
            display: none !important;
        }

        /* 【核心修改】大幅增大了左下角视图布局（变成原本的 2.5 倍大小） */
        .second-view {
            position: fixed;
            left: 40px;
            bottom: 80px; 
            z-index: 10;
            max-width: 750px; /* 从 420px 扩大 */
            width: calc(100% - 80px);
        }

        .character-chat {
            display: flex;
            flex-direction: row; 
            align-items: flex-end; 
            gap: 25px; /* 增大间距 */
        }

        .guomo-character {
            width: 180px;  /* 从 75px 扩大至 2.4 倍 */
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 12px 30px rgba(0, 0, 0, 0.4));
            pointer-events: none;
            flex-shrink: 0;
        }

        /* 对话面板大尺寸化 */
        .ai-chat {
            flex: 1;
            color: #4b1f2d;
            text-shadow: none;
        }

        .ai-chat-panel {
            background: rgba(255, 250, 252, 0.96);
            border: 1.5px solid rgba(190, 130, 145, 0.45);
            border-radius: 24px; /* 稍加圆润 */
            box-shadow: 0 18px 45px rgba(18, 12, 22, 0.25);
            backdrop-filter: blur(12px);
            padding: 22px; /* 扩大内边距 */
        }

        .ai-chat-messages {
            min-height: 140px; /* 高度翻倍 */
            max-height: 260px;
            overflow-y: auto;
            padding: 8px;
            font-size: 1.15rem; /* 字号增大 */
            line-height: 1.6;
            text-align: left;
        }

        .ai-chat-message {
            margin-bottom: 12px;
        }

        .ai-chat-message strong {
            color: #b83256;
            font-size: 1.2rem;
        }

        .ai-chat-form {
            display: flex;
            gap: 12px;
            margin-top: 14px;
        }

        .ai-chat-input {
            flex: 1;
            min-width: 0;
            border: 1.5px solid rgba(184, 50, 86, 0.35);
            border-radius: 999px;
            padding: 10px 20px; /* 增大输入框手感 */
            font: inherit;
            font-size: 1.05rem;
            color: #4b1f2d;
            outline: none;
            background: rgba(255, 255, 255, 0.9);
        }

        .ai-chat-input:focus {
            border-color: #ff7894;
            box-shadow: 0 0 0 4px rgba(255, 120, 148, 0.25);
        }

        .ai-chat-button {
            width: 44px; /* 从 32px 扩大 */
            height: 44px;
            border: 0;
            border-radius: 50%;
            background: #ff7894;
            color: white;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: transform 0.2s ease, background 0.2s ease;
            flex-shrink: 0;
        }

        .ai-chat-button svg {
            width: 18px; /* 放大图标 */
            height: 18px;
        }

        .ai-chat-button:hover {
            transform: translateY(-2px);
            background: #e85f7d;
        }

        .ai-chat-button:disabled {
            cursor: wait;
            opacity: 0.7;
            transform: none;
        }

        body.light-mode .ai-chat-panel {
            background: rgba(255, 255, 255, 0.98);
            border-color: rgba(180, 130, 140, 0.45);
        }

        @media (max-width: 768px) {
            .second-view { left: 15px; bottom: 65px; width: calc(100% - 30px); }
            .guomo-character { width: 100px; }
            .ai-chat-panel { padding: 12px; }
            .ai-chat-messages { min-height: 90px; font-size: 0.95rem; }
            .book-container { width: 90vw; height: auto; min-height: 260px; padding: 18px; }
            .open-book-text { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>

    <div class="navbar">
        <div style="width: 60px;"></div>
        <h1 class="title">Library</h1>
        <div style="width: 60px;"></div>
    </div>

    <div class="container">
        <div class="quote-box">
            <p class="quote" id="monologue"></p>
        </div>

        <div id="secondView" class="second-view hidden">
            <div class="character-chat">
                <img class="guomo-character" src="./images/guomo_suit_cutout_clean.png" alt="Guomo" onerror="this.onerror=null; this.src='./images/guomo_suit_cutout_clean.png'">
                <div class="ai-chat" aria-label="AI chat">
                    <div class="ai-chat-panel">
                        <div class="ai-chat-messages" id="chatDisplay">
                            <div class="ai-chat-message"><strong>守护者:</strong> 你好，欢迎来到图书馆，我会在这里陪你探秘。</div>
                        </div>
                        <form class="ai-chat-form" id="chatForm">
                            <input class="ai-chat-input" id="userInput" type="text" placeholder="输入你的问题..." autocomplete="off">
                            <button class="ai-chat-button" id="sendButton" type="submit" aria-label="发送消息">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M3.5 20.5 21 12 3.5 3.5 6 10.5 14 12 6 13.5z" fill="currentColor"/>
                                </svg>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div id="bookContainer" class="book-wrapper">
            <img id="closedBook" class="book-img" src="./images/book.jpg" alt="A dusty old book" 
                 onerror="this.onerror=null; this.src='data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'%3E%3Crect width=\'100\' height=\'100\' fill=\'%238B5A2B\'/%3E%3Cpath fill=\'%23EBC485\' d=\'M30,25 L70,25 L70,75 L30,75 Z\'/%3E%3Cline x1=\'45\' y1=\'35\' x2=\'65\' y2=\'35\' stroke=\'%23443322\' stroke-width=\'3\'/%3E%3Cline x1=\'45\' y1=\'47\' x2=\'60\' y2=\'47\' stroke=\'%23443322\' stroke-width=\'3\'/%3E%3Ccircle cx=\'45\' cy=\'62\' r=\'5\' fill=\'%23DDAA66\'/%3E%3C/svg%3E';">
        </div>

        <a href="https://amber2713.github.io/sitetwo/hall/" class="explore-icon" id="exploreIcon">
            <i class="fas fa-compass"></i>
        </a>
        <div class="explore-text" id="exploreText">Explore the Library</div>
    </div>

    <div class="open-book-overlay" id="openBookOverlay">
            <div class="book-container" id="openBookContainer">
                <div class="open-book-text" id="openBookText">
                    中国科学技术大学东校区，有着知识洋溢的图书馆，有着充满欢笑和回忆的郭沫若广场，有着天才的学院，有着静谧的咖啡馆，还有着粉红色的樱花大道，到处充满着浪漫的气息。
                </div>
            </div>
        </div>
    <div class="footer">
        <p>© 3099 · Library of Recollection</p>
    </div>

    <script>
        let currentPhase = 0;
        let typingTimeout = null;
        let isTypingInProgress = false;
        let phaseTransitionLock = false;
        let bookClickEnabled = false;

        const monologueEl = document.getElementById('monologue');
        const bookContainer = document.getElementById('bookContainer');
        const secondView = document.getElementById('secondView');
        const exploreIcon = document.getElementById('exploreIcon');
        const exploreText = document.getElementById('exploreText');
        const bodyEl = document.body;

        // 获取新增的过渡元素
        const openBookOverlay = document.getElementById('openBookOverlay');
        const openBookContainer = document.getElementById('openBookContainer');
        const openBookText = document.getElementById('openBookText');

        const phase0Text = `I've come to the library of USTC, which in my memory holds all knowledge, but it looks so dilapidated now.\nHey, there's a book on the floor. Let me pick it up and see.`;
        const phase1Text = `What was that book? It's gone. This library feels different now.`;

        const TYPING_SPEED = 55;

        function abortTyping() {
            if (typingTimeout) {
                clearTimeout(typingTimeout);
                typingTimeout = null;
            }
            isTypingInProgress = false;
        }

        function resetAndClearText() {
            abortTyping();
            if (monologueEl) {
                monologueEl.textContent = '';
                monologueEl.classList.remove('cursor');
            }
        }

        function typeTextToElement(text, onComplete, removeCursorWhenDone = true) {
            if (!monologueEl) return;
            abortTyping();
            monologueEl.textContent = '';
            monologueEl.classList.add('cursor');
            
            let idx = 0;
            const len = text.length;
            
            function typeChar() {
                if (idx < len) {
                    monologueEl.textContent += text[idx];
                    idx++;
                    typingTimeout = setTimeout(typeChar, TYPING_SPEED);
                } else {
                    if (removeCursorWhenDone) {
                        monologueEl.classList.remove('cursor');
                    }
                    isTypingInProgress = false;
                    typingTimeout = null;
                    if (onComplete && typeof onComplete === 'function') {
                        onComplete();
                    }
                }
            }
            isTypingInProgress = true;
            typeChar();
        }

        // ---------- 点击旧书后触发新的中间过渡剧情 ----------
        function onBookClickHandler(event) {
            if (currentPhase !== 0 || phaseTransitionLock || !bookClickEnabled) return;
            phaseTransitionLock = true;

            // 1. 隐藏地上的旧书
            if (bookContainer) {
                bookContainer.style.setProperty('display', 'none', 'important');
            }

            // 2. 展现翻开的书（淡入特效），此时背景依然维持 filter: brightness(0.4) 较暗状态
            openBookOverlay.classList.add('active');

            // 3. 稍做延迟让书本展开后，再使文字平滑浮现 (fade-in)
            setTimeout(() => {
                openBookText.classList.add('fade-in');
                
                // 4. 文字停留展示 4.5 秒后，自动执行隐去与进入光亮图书馆阶段
                setTimeout(() => {
                    // 文字与翻开的书执行“隐去”特效
                    openBookText.classList.remove('fade-in');
                    openBookOverlay.classList.remove('active');

                    // 5. 待隐去动画彻底结束后 (800ms)，正式解锁并渲染 Guomo 视角
                    setTimeout(() => {
                        enterBrightLibrary();
                    }, 800);

                }, 4500); 

            }, 400);
        }

        // ---------- 最终阶段：进入明亮的图书馆 ----------
        function enterBrightLibrary() {
            currentPhase = 1;
            
            // 显示左下角放大的 Guomo 形象和宽敞的聊天面板
            if (secondView) {
                secondView.classList.remove('hidden');
            }
            
            // 切换亮色模式（触发 CSS 里的背景 brightness 提升至 0.95）
            bodyEl.classList.add('light-mode');
            
            resetAndClearText();
            
            typeTextToElement(phase1Text, () => {
                showExploreEntrance();
                phaseTransitionLock = false; // 整个流程顺利完毕，解锁
            }, true);
        }
        
        function showExploreEntrance() {
            if (!exploreIcon || !exploreText) return;
            exploreIcon.style.display = 'flex';
            exploreText.style.display = 'block';
            exploreIcon.style.opacity = '0';
            exploreText.style.opacity = '0';
            exploreIcon.style.transition = 'opacity 0.9s ease';
            exploreText.style.transition = 'opacity 0.9s ease';
            
            setTimeout(() => {
                exploreIcon.style.opacity = '1';
                exploreText.style.opacity = '1';
            }, 30);
        }
        
        function initPhaseOne() {
            currentPhase = 0;
            phaseTransitionLock = false;
            bookClickEnabled = false;
            bodyEl.classList.remove('light-mode');

            if (exploreIcon) {
                exploreIcon.style.display = 'none';
                exploreIcon.style.opacity = '0';
            }
            if (exploreText) {
                exploreText.style.display = 'none';
                exploreText.style.opacity = '0';
            }

            if (bookContainer) {
                bookContainer.style.display = 'flex';
                bookContainer.style.pointerEvents = 'none';
                bookContainer.style.cursor = 'not-allowed';
            }

            if (secondView) {
                secondView.classList.add('hidden');
            }

            if (openBookOverlay) openBookOverlay.classList.remove('active');
            if (openBookText) openBookText.classList.remove('fade-in');

            resetAndClearText();
            typeTextToElement(phase0Text, () => {
                if (monologueEl) monologueEl.classList.remove('cursor');
                bookClickEnabled = true;
                if (bookContainer) {
                    bookContainer.style.pointerEvents = 'auto';
                    bookContainer.style.cursor = 'pointer';
                }
            }, true);
        }

        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            if (!particlesContainer) return;
            particlesContainer.innerHTML = '';
            const particleCount = 55;
            for (let i = 0; i < particleCount; i++) {
                const p = document.createElement('div');
                p.classList.add('particle');
                const size = Math.random() * 6 + 1.5;
                p.style.width = `${size}px`;
                p.style.height = `${size}px`;
                p.style.left = `${Math.random() * 100}%`;
                p.style.top = `${Math.random() * 100}%`;
                p.style.animationDuration = `${12 + Math.random() * 18}s`;
                p.style.animationDelay = `${Math.random() * 15}s`;
                p.style.opacity = `${0.3 + Math.random() * 0.5}`;
                particlesContainer.appendChild(p);
            }
        }
        
        function enhanceBookImageFallback() {
            const bookImg = document.getElementById('closedBook');
            if (!bookImg) return;
            if (bookImg.complete && (bookImg.naturalWidth === 0 || bookImg.naturalHeight === 0)) {
                if (!bookImg.src.includes('data:image/svg')) {
                    bookImg.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%238B5A2B'/%3E%3Cpath fill='%23EBC485' d='M30,25 L70,25 L70,75 L30,75 Z'/%3E%3Cline x1='45' y1='35' x2='65' y2='35' stroke='%23443322' stroke-width='3'/%3E%3Cline x1='45' y1='47' x2='60' y2='47' stroke='%23443322' stroke-width='3'/%3E%3Ccircle cx='45' cy='62' r='5' fill='%23DDAA66'/%3E%3C/svg%3E";
                }
            }

        }

        const chatHistory = [];

        function escapeHtml(value) {
            return value
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function addChatMessage(role, content) {
            const chatDisplay = document.getElementById('chatDisplay');
            if (!chatDisplay) return;
            const message = document.createElement('div');
            message.className = 'ai-chat-message';
            const speaker = role === 'user' ? '你' : '守护者';
            message.innerHTML = `<strong>${speaker}:</strong> ${escapeHtml(content)}`;
            chatDisplay.appendChild(message);
            chatDisplay.scrollTop = chatDisplay.scrollHeight;
            return message;
        }

        async function handleChat(text) {
            chatHistory.push({ role: 'user', content: text });
            addChatMessage('user', text);

            const loadingMessage = addChatMessage('assistant', '守护者正在思考...');
            const sendButton = document.getElementById('sendButton');
            if (sendButton) {
                sendButton.disabled = true;
            }

            try {
                const response = await fetch('/.netlify/functions/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: chatHistory })
                });

                if (!response.ok) {
                    throw new Error(`Request failed: ${response.status}`);
                }

                const data = await response.json();
                const content = data.content || '守护者暂时沉默了，请稍后再试。';
                chatHistory.push({ role: 'assistant', content });
                loadingMessage.innerHTML = `<strong>守护者:</strong> ${escapeHtml(content)}`;
            } catch (error) {
                loadingMessage.innerHTML = '<strong>守护者:</strong> 风把我的回答吹走了，请稍后再试。';
            } finally {
                if (sendButton) {
                    sendButton.disabled = false;
                }
                const userInput = document.getElementById('userInput');
                if (userInput) {
                    userInput.focus();
                }
                const chatDisplay = document.getElementById('chatDisplay');
                if (chatDisplay) {
                    chatDisplay.scrollTop = chatDisplay.scrollHeight;
                }
            }
        }

        function handleChatSubmission(event) {
            event.preventDefault();
            const userInput = document.getElementById('userInput');
            if (!userInput) return;
            const text = userInput.value.trim();
            if (!text) return;
            userInput.value = '';
            handleChat(text);
        }

        function bindBookEvents() {
            if (bookContainer) {
                bookContainer.addEventListener('click', onBookClickHandler);
            }
            const chatForm = document.getElementById('chatForm');
            if (chatForm) {
                chatForm.addEventListener('submit', handleChatSubmission);
            }
        }
        
        window.addEventListener('beforeunload', () => {
            if (typingTimeout) clearTimeout(typingTimeout);
        });
        
        function init() {
            createParticles();
            initPhaseOne();
            bindBookEvents();
            enhanceBookImageFallback();
        }
        
        init();
        
        const observer = new MutationObserver(() => {
            if (currentPhase === 1 && bookContainer && bookContainer.style.display !== 'none') {
                bookContainer.style.setProperty('display', 'none', 'important');
            }
        });
        if (bookContainer) observer.observe(bookContainer, { attributes: true, attributeFilter: ['style'] });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Library Explorer · Echoes of Memory</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Cambria', Georgia, 'Times New Roman', serif;
            background-color: #0a0c15;
            color: #f0f0f0;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: color 0.4s ease;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('./images/tushuguan.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            z-index: -2;
            filter: brightness(0.4); 
            transition: filter 1.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* 亮色模式（文字播放完毕后触发） */
        body.light-mode::before {
            filter: brightness(0.95);
        }

        /* 浮动微粒 */
        .particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 235, 190, 0.5);
            animation: floatParticle 18s infinite linear;
        }
        @keyframes floatParticle {
            0% { transform: translateY(0) translateX(0); opacity: 0.6; }
            100% { transform: translateY(-100vh) translateX(80px); opacity: 0; }
        }

        /* 导航栏 */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(10, 15, 30, 0.45);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            z-index: 15;
            transition: all 0.5s ease;
        }
        body.light-mode .navbar {
            background: rgba(245, 240, 225, 0.6);
            border-bottom: 1px solid rgba(150, 110, 60, 0.3);
        }

        .title {
            font-size: 2.7rem;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #ecdca8, #cbad7a);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 600;
        }
        body.light-mode .title {
            background: linear-gradient(135deg, #8b5a2b, #c68b3c);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 主容器 */
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 24px 60px;
            text-align: center;
            width: 100%;
            position: relative;
        }

        /* 顶部的提示独白框（第一阶段使用） */
        .quote-box {
            background: rgba(20, 25, 45, 0.7);
            border-radius: 28px;
            padding: 25px 32px;
            margin-bottom: 20px;
            border: 1px solid rgba(200, 170, 110, 0.4);
            max-width: 850px;
            width: 100%;
            backdrop-filter: blur(3px);
            transition: all 0.5s ease;
        }
        .quote {
            font-size: 1.35rem;
            line-height: 1.6;
            color: #f3e7ce;
            font-style: italic;
        }

        /* 第一阶段：地上的旧书 */
        .book-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
            cursor: pointer;
            transition: transform 0.25s ease, filter 0.2s;
        }
        .book-wrapper:hover {
            transform: scale(1.05);
            filter: drop-shadow(0 0 15px rgba(230, 200, 120, 0.6));
        }
        .book-img {
            max-width: 220px;
            width: 65%;
            height: auto;
            border-radius: 12px;
            filter: drop-shadow(4px 8px 16px rgba(0,0,0,0.6));
        }

        /* ==================== 【新增】虚拟翻开书本样式 ==================== */
        .open-book-container {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 58vw;
            height: 48vh;
            background: #f4edd8;
            border-radius: 6px;
            box-shadow: 0 25px 55px rgba(0,0,0,0.6), inset 0 0 40px rgba(93, 64, 55, 0.15);
            display: flex;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1), transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .open-book-container.show {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }
        .open-book-container.fade-out {
            opacity: 0;
            transform: translate(-50%, -52%) scale(0.95);
            pointer-events: none;
        }
        /* 书本中缝立体阴影 */
        .open-book-container::after {
            content: '';
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 35px; height: 100%;
            background: linear-gradient(to right, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.0) 15%, rgba(0,0,0,0.22) 50%, rgba(0,0,0,0.0) 85%, rgba(0,0,0,0.1) 100%);
            z-index: 5;
        }
        .book-page {
            flex: 1;
            height: 100%;
            padding: 35px 45px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }
        .book-page-left {
            border-right: 1px solid rgba(0,0,0,0.05);
            align-items: center;
        }
        .book-page-left i {
            font-size: 5rem;
            color: rgba(93, 64, 55, 0.15);
            animation: floatIcon 4s infinite ease-in-out;
        }
        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .book-page-right {
            justify-content: flex-start;
            align-items: flex-start;
            padding-left: 35px;
        }
        /* 书本打字文本样式 */
        .book-text-content {
            font-family: 'Playfair Display', "Microsoft YaHei", serif;
            font-size: 1.22rem;
            color: #3E2723;
            line-height: 1.9;
            letter-spacing: 2px;
            font-weight: 500;
            text-align: left;
            border-right: 2px solid transparent;
        }
        .book-text-content.typing {
            border-right-color: #8D6E63;
            animation: cursorBlink 0.75s step-end infinite;
        }
        @keyframes cursorBlink {
            from, to { border-color: transparent }
            50% { border-color: #8D6E63; }
        }

        /* ==================== 【重点修改】Guomo 立绘与对话框增大 2~3 倍 ==================== */
        .second-view {
            position: fixed;
            left: 50px;
            bottom: 60px; 
            z-index: 20;
            width: 780px; /* 大幅拉宽容器以容纳巨型对话框 */
            max-width: 90vw;
            transition: all 0.8s ease;
        }
        .character-chat {
            display: flex;
            flex-direction: row;
            align-items: flex-end;
            gap: 30px; /* 增大间距 */
        }
        .guomo-character {
            width: 210px; /* 相比之前的75px，放大了近3倍 */
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 15px 35px rgba(0, 0, 0, 0.35));
            pointer-events: none;
            flex-shrink: 0;
            animation: guomoFloat 5s infinite ease-in-out;
        }
        @keyframes guomoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        .ai-chat {
            flex: 1;
            color: #4b1f2d;
            text-shadow: none;
        }
        .ai-chat-panel {
            background: rgba(255, 250, 252, 0.95);
            border: 1px solid rgba(190, 130, 145, 0.4);
            border-radius: 24px; /* 边缘更圆润大方 */
            box-shadow: 0 20px 45px rgba(18, 12, 22, 0.15);
            backdrop-filter: blur(15px);
            padding: 22px; /* 增加内边距 */
        }
        .ai-chat-messages {
            min-height: 150px; /* 对话高度扩充多倍 */
            max-height: 260px;
            overflow-y: auto;
            padding: 5px;
            font-size: 1.15rem; /* 字号显著放大 */
            line-height: 1.6;
            text-align: left;
        }
        .ai-chat-message {
            margin-bottom: 12px;
        }
        .ai-chat-message strong {
            color: #b83256;
            font-size: 1.2rem;
        }
        .ai-chat-form {
            display: flex;
            gap: 12px;
            margin-top: 15px;
        }
        .ai-chat-input {
            flex: 1;
            min-width: 0;
            border: 1px solid rgba(184, 50, 86, 0.3);
            border-radius: 999px;
            padding: 12px 24px; /* 输入框明显变大 */
            font: inherit;
            font-size: 1.05rem;
            color: #4b1f2d;
            outline: none;
            background: rgba(255, 255, 255, 0.95);
        }
        .ai-chat-input:focus {
            border-color: #ff7894;
            box-shadow: 0 0 0 4px rgba(255, 120, 148, 0.2);
        }
        .ai-chat-button {
            width: 48px; /* 按钮放大 */
            height: 48px;
            border: 0;
            border-radius: 50%;
            background: #ff7894;
            color: white;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: transform 0.2s ease, background 0.2s ease;
            flex-shrink: 0;
        }
        .ai-chat-button svg {
            width: 18px; height: 18px; /* 图标等比放大 */
        }
        .ai-chat-button:hover {
            transform: scale(1.05);
            background: #e85f7d;
        }

        /* 后续出现的出发图标 */
        .explore-icon {
            display: none; 
            align-items: center;
            justify-content: center;
            width: 110px;
            height: 110px;
            background: rgba(190, 150, 85, 0.9);
            border-radius: 50%;
            border: 2px solid #e7c389;
            cursor: pointer;
            text-decoration: none;
            margin-top: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }
        .explore-icon i {
            font-size: 44px;
            color: #2b1e0c;
        }
        .explore-icon:hover {
            transform: scale(1.1) rotate(15deg);
            background: #c99f5e;
            box-shadow: 0 0 25px rgba(230, 190, 100, 0.8);
        }
        .explore-text {
            display: none;
            margin-top: 14px;
            font-size: 1.25rem;
            letter-spacing: 1px;
            color: #ecdca8;
            font-weight: 600;
            background: rgba(0,0,0,0.4);
            padding: 6px 18px;
            border-radius: 30px;
            backdrop-filter: blur(2px);
            z-index: 10;
        }

        .footer {
            text-align: center;
            padding: 18px;
            font-size: 0.85rem;
            color: #b9aa86;
            background: rgba(10, 15, 30, 0.5);
            transition: all 0.3s;
            margin-top: auto;
            z-index: 5;
        }
        body.light-mode .footer {
            color: #4a3b28;
            background: rgba(245, 240, 225, 0.5);
        }

        .hidden {
            display: none !important;
        }

        /* 移动端与小屏幕适配 */
        @media (max-width: 1024px) {
            .open-book-container { width: 85vw; height: 50vh; }
            .second-view { width: 90vw; left: 5vw; bottom: 80px; }
            .guomo-character { width: 140px; }
        }
        @media (max-width: 650px) {
            .title { font-size: 2rem; }
            .open-book-container { flex-direction: column; height: 65vh; width: 85vw; }
            .book-page-left { display: none; }
            .book-page-right { padding: 25px; }
            .book-text-content { font-size: 1.05rem; line-height: 1.7; }
            .character-chat { gap: 15px; }
            .guomo-character { width: 95px; }
            .ai-chat-messages { min-height: 110px; font-size: 0.95rem; }
            .ai-chat-input { padding: 8px 16px; font-size: 0.9rem; }
            .ai-chat-button { width: 38px; height: 38px; }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>

    <div class="navbar">
        <div style="width: 60px;"></div>
        <h1 class="title">Library</h1>
        <div style="width: 60px;"></div>
    </div>

    <div class="container">
        <div class="quote-box" id="guideBox">
            <p class="quote" id="monologue"></p>
        </div>

        <div id="bookContainer" class="book-wrapper">
            <img id="closedBook" class="book-img" src="./images/book.jpg" alt="A dusty old book" 
                 onerror="this.onerror=null; this.src='data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'%3E%3Crect width=\'100\' height=\'100\' fill=\'%238B5A2B\'/%3E%3Cpath fill=\'%23EBC485\' d=\'M30,25 L70,25 L70,75 L30,75 Z\'/%3E%3Cline x1=\'45\' y1=\'35\' x2=\'65\' y2=\'35\' stroke=\'%23443322\' stroke-width=\'3\'/%3E%3Cline x1=\'45\' y1=\'47\' x2=\'60\' y2=\'47\' stroke=\'%23443322\' stroke-width=\'3\'/%3E%3Ccircle cx=\'45\' cy=\'62\' r=\'5\' fill=\'%23DDAA66\'/%3E%3C/svg%3E';">
        </div>

        <div class="open-book-container" id="openBook">
            <div class="book-page book-page-left">
                <i class="fas fa-book-open"></i>
            </div>
            <div class="book-page book-page-right">
                <div class="book-text-content typing" id="bookTypingTarget"></div>
            </div>
        </div>

        <div id="secondView" class="second-view hidden">
            <div class="character-chat">
                <img class="guomo-character" src="./images/guomo_suit_cutout_clean.png" alt="Guomo" onerror="this.onerror=null; this.src='./images/guomo_suit_cutout_clean.png'">
                <div class="ai-chat" aria-label="AI chat">
                    <div class="ai-chat-panel">
                        <div class="ai-chat-messages" id="chatDisplay">
                            <div class="ai-chat-message"><strong>守护者:</strong> 你好，欢迎来到中国科学技术大学东区图书馆，我会在这里陪你探秘。</div>
                        </div>
                        <form class="ai-chat-form" id="chatForm">
                            <input class="ai-chat-input" id="userInput" type="text" placeholder="输入你的问题..." autocomplete="off">
                            <button class="ai-chat-button" id="sendButton" type="submit" aria-label="发送消息">
                                <svg viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M3.5 20.5 21 12 3.5 3.5 6 10.5 14 12 6 13.5z"/>
                                </svg>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <a href="https://amber2713.github.io/sitetwo/hall/" class="explore-icon" id="exploreIcon">
            <i class="fas fa-compass"></i>
        </a>
        <div class="explore-text" id="exploreText">Explore the Library</div>
    </div>

    <div class="footer">
        <p>© 3099 · Library of Recollection</p>
    </div>

    <script>
        let currentPhase = 0;
        let typingTimeout = null;
        let isTypingInProgress = false;
        let phaseTransitionLock = false;

        const monologueEl = document.getElementById('monologue');
        const guideBox = document.getElementById('guideBox');
        const bookContainer = document.getElementById('bookContainer');
        const openBook = document.getElementById('openBook');
        const bookTypingTarget = document.getElementById('bookTypingTarget');
        const secondView = document.getElementById('secondView');
        const exploreIcon = document.getElementById('exploreIcon');
        const exploreText = document.getElementById('exploreText');
        const bodyEl = document.body;

        // 台词内容
        const phase0Text = `I've come to the library of USTC, which in my memory holds all knowledge, but it looks so dilapidated now.\nHey, there's a book on the floor. Let me pick it up and see.`;
        
        // 核心新增：翻开书上要打印的完整长句
        const ustcDescriptionText = "中国科学技术大学东校区，有着知识洋溢的图书馆，有着充满欢笑和回忆的郭沫若广场，有着天才的学院，有着静谧的咖啡馆，还有着粉红色的樱花大道，到处充满着浪漫的气息。";

        const TYPING_SPEED = 65;

        function abortTyping() {
            if (typingTimeout) {
                clearTimeout(typingTimeout);
                typingTimeout = null;
            }
            isTypingInProgress = false;
        }

        // 第一阶段的引导字打印
        function typeTextToElement(text, onComplete) {
            if (!monologueEl) return;
            abortTyping();
            monologueEl.textContent = '';
            monologueEl.classList.add('cursor');
            
            let idx = 0;
            function typeChar() {
                if (idx < text.length) {
                    monologueEl.textContent += text[idx];
                    idx++;
                    typingTimeout = setTimeout(typeChar, 40);
                } else {
                    monologueEl.classList.remove('cursor');
                    isTypingInProgress = false;
                    typingTimeout = null;
                    if (onComplete) onComplete();
                }
            }
            isTypingInProgress = true;
            typeChar();
        }

        // ==================== 【全新核心交互控制】 ====================
        function onBookClickHandler() {
            if (currentPhase !== 0 || phaseTransitionLock) return;
            phaseTransitionLock = true;

            // 1. 先让原先顶部的引导提示框和地上的旧书优雅淡出隐去
            guideBox.style.opacity = '0';
            bookContainer.style.opacity = '0';
            
            setTimeout(() => {
                guideBox.classList.add('hidden');
                bookContainer.style.setProperty('display', 'none', 'important');
                
                // 2. 唤醒并淡入中间那本“大翻开书本”组件（此时背景依旧保持偏暗）
                openBook.classList.add('show');
                
                // 3. 缓缓冲过淡入动画后，开始在翻开的书页上打印那段浪漫唯美的 USTC 台词
                setTimeout(startBookTyping, 900);
            }, 500);
        }

        function startBookTyping() {
            bookTypingTarget.textContent = '';
            bookTypingTarget.classList.add('typing');
            
            let idx = 0;
            function type() {
                if (idx < ustcDescriptionText.length) {
                    bookTypingTarget.textContent += ustcDescriptionText.charAt(idx);
                    idx++;
                    // 模拟更天然的真人打字节奏
                    typingTimeout = setTimeout(type, TYPING_SPEED + Math.random() * 30);
                } else {
                    // 文字播放完成，关掉打字机光标
                    bookTypingTarget.classList.remove('typing');
                    
                    // 预留 2.2 秒供用户细细品味阅读这段文字，随后自动隐去书本、切入终极明亮场景
                    setTimeout(() => {
                        openBook.classList.remove('show');
                        openBook.classList.add('fade-out');
                        
                        // 书本淡出动画完结后，瞬间切入亮色模式，并释放巨大的 Guomo 立绘和聊天面板
                        setTimeout(enterFinalBrightLibrary, 1000);
                    }, 2200);
                }
            }
            type();
        }

        function enterFinalBrightLibrary() {
            currentPhase = 1;
            openBook.classList.add('hidden');

            // 1. 激活亮色模式控制（背景光亮度大幅提升至 0.95）
            bodyEl.classList.add('light-mode');

            // 2. 闪亮登场：展示放大 2~3 倍的 Guomo 形象和巨型 AI 聊天区域
            secondView.classList.remove('hidden');
            secondView.style.opacity = '0';
            secondView.style.transition = 'opacity 1s ease';
            setTimeout(() => { secondView.style.opacity = '1'; }, 50);

            // 3. 同步淡入指南针探险大按钮
            showExploreEntrance();
        }
        
        function showExploreEntrance() {
            if (!exploreIcon || !exploreText) return;
            exploreIcon.style.display = 'flex';
            exploreText.style.display = 'block';
            exploreIcon.style.opacity = '0';
            exploreText.style.opacity = '0';
            exploreIcon.style.transition = 'opacity 1.2s ease';
            exploreText.style.transition = 'opacity 1.2s ease';
            
            setTimeout(() => {
                exploreIcon.style.opacity = '1';
                exploreText.style.opacity = '1';
            }, 100);
        }
        
        function initPhaseOne() {
            currentPhase = 0;
            phaseTransitionLock = false;
            bodyEl.classList.remove('light-mode');
            guideBox.classList.remove('hidden');
            guideBox.style.opacity = '1';
            
            if (bookContainer) {
                bookContainer.style.display = 'flex';
                bookContainer.style.opacity = '1';
            }
            openBook.classList.remove('show', 'fade-out', 'hidden');
            secondView.classList.add('hidden');
            
            if (exploreIcon) exploreIcon.style.display = 'none';
            if (exploreText) exploreText.style.display = 'none';
            
            typeTextToElement(phase0Text);
        }

        // ==================== 以下为原项目的 AI Chat API 对接与微粒逻辑 ====================
        const chatHistory = [];

        function escapeHtml(value) {
            return value.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function addChatMessage(role, content) {
            const chatDisplay = document.getElementById('chatDisplay');
            if (!chatDisplay) return;
            const message = document.createElement('div');
            message.className = 'ai-chat-message';
            const speaker = role === 'user' ? '你' : '守护者';
            message.innerHTML = `<strong>${speaker}:</strong> ${escapeHtml(content)}`;
            chatDisplay.appendChild(message);
            chatDisplay.scrollTop = chatDisplay.scrollHeight;
            return message;
        }

        async function handleChat(text) {
            chatHistory.push({ role: 'user', content: text });
            addChatMessage('user', text);

            const loadingMessage = addChatMessage('assistant', '守护者正在思考...');
            const sendButton = document.getElementById('sendButton');
            if (sendButton) sendButton.disabled = true;

            try {
                const response = await fetch('/.netlify/functions/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: chatHistory })
                });
                if (!response.ok) throw new Error(`Status: ${response.status}`);
                const data = await response.json();
                const content = data.content || '守护者暂时沉默了，请稍后再试。';
                chatHistory.push({ role: 'assistant', content });
                loadingMessage.innerHTML = `<strong>守护者:</strong> ${escapeHtml(content)}`;
            } catch (error) {
                loadingMessage.innerHTML = '<strong>守护者:</strong> 风把我的回答吹走了，请稍后再试。';
            } finally {
                if (sendButton) sendButton.disabled = false;
                const userInput = document.getElementById('userInput');
                if (userInput) userInput.focus();
                const chatDisplay = document.getElementById('chatDisplay');
                if (chatDisplay) chatDisplay.scrollTop = chatDisplay.scrollHeight;
            }
        }

        function handleChatSubmission(event) {
            event.preventDefault();
            const userInput = document.getElementById('userInput');
            if (!userInput) return;
            const text = userInput.value.trim();
            if (!text) return;
            userInput.value = '';
            handleChat(text);
        }

        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            if (!particlesContainer) return;
            particlesContainer.innerHTML = '';
            for (let i = 0; i < 45; i++) {
                const p = document.createElement('div');
                p.classList.add('particle');
                const size = Math.random() * 5 + 1.5;
                p.style.width = `${size}px`;
                p.style.height = `${size}px`;
                p.style.left = `${Math.random() * 100}%`;
                p.style.top = `${Math.random() * 100}%`;
                p.style.animationDuration = `${12 + Math.random() * 15}s`;
                p.style.animationDelay = `${Math.random() * 10s}`;
                particlesContainer.appendChild(p);
            }
        }

        function bindEvents() {
            if (bookContainer) bookContainer.addEventListener('click', onBookClickHandler);
            const chatForm = document.getElementById('chatForm');
            if (chatForm) chatForm.addEventListener('submit', handleChatSubmission);
        }

        window.addEventListener('beforeunload', () => { if (typingTimeout) clearTimeout(typingTimeout); });
        
        function init() {
            createParticles();
            initPhaseOne();
            bindEvents();
        }
        init();
    </script>
</body>
</html>
